[phases.setup]
nixPkgs = ["python311", "gcc", "python311Packages.pip"]

[phases.install]
cmds = ["cd backend && python -m pip install --upgrade pip", "cd backend && python -m pip install -r requirements.txt"]

[phases.build]
cmds = ["cd backend && mkdir -p data/chromadb data/uploads"]

[start]
cmd = "cd backend && python main.py"
