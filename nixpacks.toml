[phases.setup]
nixPkgs = ["python311", "gcc", "libffi"]

[phases.install]
cmds = ["pip3 install --upgrade pip", "cd backend && pip3 install -r requirements.txt"]

[phases.build]
cmds = ["cd backend && mkdir -p data/chromadb data/uploads"]

[start]
cmd = "cd backend && python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
