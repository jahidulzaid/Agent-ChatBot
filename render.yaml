services:
  # Backend Service
  - type: web
    name: agentic-chatbot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.render.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini-2024-07-18
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: "3.11"
    disk:
      name: chatbot-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Service
  - type: web
    name: agentic-chatbot-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
